<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7a4f24" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>MAKEZERO</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button class="icon-btn" id="btn-restart" aria-label="새 게임">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <path d="M20 4v5h-5" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="score-block">
          <div class="score" id="score">0</div>
        </div>
        <button class="icon-btn" id="btn-help" aria-label="규칙">?</button>
      </header>

      <div class="sub-hud">
        <div class="chip" id="chip-games">게임 1</div>
        <div class="chip" id="chip-best">오늘 <b id="best">0</b> <span class="crown">&#9819;</span></div>
      </div>

      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board"></div>
      </div>

      <p class="notice" id="notice" role="status" aria-live="polite"></p>

      <footer class="actions">
        <button class="round-btn" id="btn-add" aria-label="숫자 추가">
          <span class="glyph">&#43;</span><span class="badge" id="badge-add">6</span>
        </button>
        <button class="round-btn" id="btn-hint" aria-label="힌트">
          <span class="glyph">&#128161;</span><span class="badge" id="badge-hint">3</span>
        </button>
      </footer>

      <div class="overlay hidden" id="overlay">
        <div class="panel">
          <h1 class="panel-title" id="overlay-title">게임 종료</h1>
          <p class="panel-body" id="overlay-body"></p>
          <button class="wood-btn" id="btn-again">다시 하기</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
