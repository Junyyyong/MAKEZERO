<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#241247" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>TAP to TEN</title>
  </head>
  <body>
    <div id="app">
      <!-- ── splash ────────────────────────────────────────────── -->
      <section class="screen splash-screen" id="screen-splash" aria-label="TAP to TEN 시작">
        <div class="splash-logo">TAP <span>to</span> TEN</div>
        <div class="splash-pulse" aria-hidden="true">10</div>
      </section>

      <!-- ── title ─────────────────────────────────────────────── -->
      <section class="screen title-screen hidden" id="screen-title">
        <div class="brand-block">
          <h1 class="brand">
            <img class="brand-mark" src="./logo.svg" alt="TAP to TEN" width="574" height="567" />
          </h1>
          <p class="tagline">타닥, 타다닥 — 두드려서 10</p>
        </div>

        <!-- The collection so far. It fills the middle of the screen with the
             thing the game is actually about, and it is where character art
             can go later. -->
        <div class="title-collection" id="title-collection">
          <p class="collection-count" id="collection-count">모은 그림 0 / 99</p>
          <div class="collection-strip" id="collection-strip"></div>
        </div>

        <div class="title-actions">
          <button class="play-btn" id="btn-title-play">PLAY</button>

          <nav class="mode-list collapsed" id="mode-list" aria-label="게임 모드">
            <button class="mode-btn" id="mode-story" data-mode="story">
              <span class="mode-name">스토리</span>
              <span class="mode-desc" id="desc-story">스테이지 1</span>
            </button>
            <button class="mode-btn" id="mode-timeAttack" data-mode="timeAttack">
              <span class="mode-name">타임어택</span>
              <span class="mode-desc" id="desc-timeAttack">60초 도전</span>
            </button>
            <button class="mode-btn" id="mode-endless" data-mode="endless">
              <span class="mode-name">무제한</span>
              <span class="mode-desc" id="desc-endless">끝까지 지우기</span>
            </button>
          </nav>
        </div>

        <div class="title-links">
          <button class="text-btn" id="btn-title-tutorial">튜토리얼</button>
          <button class="text-btn" id="btn-title-gallery">갤러리</button>
          <button class="text-btn" id="btn-title-settings">설정</button>
          <button class="text-btn" id="btn-title-rules">규칙 보기</button>
        </div>
      </section>

      <!-- ── game ──────────────────────────────────────────────── -->
      <section class="screen game-screen hidden" id="screen-game">
        <header class="hud">
          <button class="icon-btn" id="btn-back" aria-label="모드 선택으로">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="score-block">
            <div class="score-label">SCORE</div>
            <div class="score" id="score">0</div>
            <div class="score-best" id="score-best">BEST 0</div>
          </div>
          <button class="icon-btn" id="btn-pause" aria-label="일시정지">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 6v12M15 6v12" />
            </svg>
          </button>
        </header>

        <div class="sub-hud">
          <div class="chip" id="chip-left">게임 1</div>
          <div class="chip" id="chip-right">오늘 <b>0</b></div>
        </div>

        <div class="timer-bar hidden" id="timer-bar"><span id="timer-fill"></span></div>

        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board"></div>
        </div>

        <!-- Future character art lives here. The empty stage is intentional. -->
        <div class="stage-floor" id="stage-floor" aria-label="캐릭터 무대"></div>

        <p class="notice" id="notice" role="status" aria-live="polite"></p>

        <footer class="actions">
          <div class="selection-sum" id="selection-sum" aria-live="polite">
            <span>SUM</span><b>0</b>
          </div>
          <button class="round-btn" id="btn-hint" aria-label="힌트">
            <span class="glyph">&#128161;</span><span class="badge" id="badge-hint">3</span>
          </button>
          <button class="round-btn hidden" id="btn-split" aria-label="블록 나누기">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4v4a4 4 0 0 0 4 4h6" stroke-linejoin="round" />
              <path d="M5 20v-4a4 4 0 0 1 4-4h6" stroke-linejoin="round" />
              <path d="m16 9 3 3-3 3" stroke-linejoin="round" />
            </svg>
            <span class="badge" id="badge-split">3</span>
          </button>
          <button class="round-btn hidden" id="btn-undo" aria-label="한 수 물리기">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h9a5 5 0 0 1 0 10h-3" stroke-linejoin="round" />
              <path d="M7 5 3.5 9 7 13" stroke-linejoin="round" />
            </svg>
            <span class="badge" id="badge-undo">3</span>
          </button>
        </footer>
      </section>

      <!-- ── tutorial ──────────────────────────────────────────── -->
      <section class="screen tutorial-screen hidden" id="screen-tutorial">
        <header class="tutorial-head">
          <div class="tutorial-dots" id="tutorial-dots"></div>
          <button class="text-btn" id="btn-tutorial-skip">건너뛰기</button>
        </header>

        <p class="tutorial-instruction" id="tutorial-instruction"></p>

        <div class="board-wrap tutorial-board-wrap" id="tutorial-board-wrap">
          <div class="board" id="tutorial-board"></div>
        </div>

        <div class="tutorial-foot">
          <p class="tutorial-reward" id="tutorial-reward"></p>
          <button class="wood-btn hidden" id="btn-tutorial-next">다음</button>
        </div>
      </section>

      <!-- ── gallery ───────────────────────────────────────────── -->
      <section class="screen gallery-screen hidden" id="screen-gallery">
        <header class="hud">
          <button class="icon-btn" id="btn-gallery-back" aria-label="모드 선택으로">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="score-block"><div class="gallery-title">갤러리</div></div>
          <span class="icon-spacer"></span>
        </header>

        <div class="gallery-body">
          <div class="record-cards">
            <div class="record-card">
              <span class="record-label">모은 그림</span>
              <b class="record-value" id="record-plates">0</b>
            </div>
            <div class="record-card">
              <span class="record-label">타임어택 최고</span>
              <b class="record-value" id="record-timeattack">0</b>
            </div>
            <div class="record-card">
              <span class="record-label">무제한 최고</span>
              <b class="record-value" id="record-endless">0</b>
            </div>
          </div>
          <div class="plate-grid" id="plate-grid"></div>
        </div>

        <!-- One picture, filling the screen. Tapping anywhere closes it. -->
        <div class="plate-view hidden" id="plate-view">
          <div class="plate-full" id="plate-full"></div>
          <p class="plate-caption" id="plate-caption"></p>
        </div>
      </section>

      <!-- ── story beat ────────────────────────────────────────── -->
      <section class="screen story-screen hidden" id="screen-story">
        <div class="story-card">
          <img class="story-portrait" id="story-portrait" alt="" />
          <h2 class="story-title" id="story-title"></h2>
          <p class="story-name" id="story-name"></p>
          <p class="story-line" id="story-line"></p>
          <button class="wood-btn" id="btn-story-next">다음</button>
        </div>
      </section>

      <div class="overlay hidden" id="overlay">
        <div class="panel">
          <h1 class="panel-title" id="overlay-title">게임 종료</h1>
          <p class="panel-body" id="overlay-body"></p>
          <div class="panel-actions">
            <button class="wood-btn" id="btn-primary">다시 하기</button>
            <button class="wood-btn ghost" id="btn-secondary">모드 선택</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
