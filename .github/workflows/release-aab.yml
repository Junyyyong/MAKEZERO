name: Release AAB

# Produces the signed .aab to upload to the Play Console. Requires four repo
# secrets; without them the run fails fast rather than emitting an unsigned
# bundle that the Play Console would reject.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "versionName to stamp (e.g. 1.0.1)"
        required: false
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Check signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::missing secret for $name — see README.md" && exit 1
            fi
          done

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Stamp versionName
        if: inputs.versionName != ''
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.versionName }}\"/" android/app/build.gradle

      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/keystore.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Bundle release
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: makezero-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
